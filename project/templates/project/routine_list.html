{% extends 'project/base.html' %} {% block content %}
<h1>My Routines</h1>
<ul>
  {% for routine in object_list %}
  <li>
    <a href="{% url 'routine-detail' routine.pk %}">{{ routine.name }}</a>
    ({{ routine.date }})
  </li>
  {% empty %}
  <li>No routines found.</li>
  {% endfor %}
</ul>
{% endblock %}
